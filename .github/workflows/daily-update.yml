name: Daily ETH risk score update
on:
  schedule:
    # 00:20 UTC daily — after the day's daily candle has closed, 5 min after BTC
    - cron: '20 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run risk score update
        run: python eth_risk_score.py --update
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eth_risk_history.json data/eth_prices_raw.json
          git diff --cached --quiet || git commit -m "Daily ETH risk score update"
          git push
